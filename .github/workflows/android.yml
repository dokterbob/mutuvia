# SPDX-License-Identifier: AGPL-3.0-or-later
# NOTE: move this file to .github/workflows/android.yml — it could not be pushed
# there from the sandbox, which lacks the GitHub `workflow` token scope.
name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'package.json'
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so `v*` tags always build.
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'package.json'
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a release run half-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Android SDK is preinstalled on ubuntu-24.04 runners.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper jar checksum. Only main writes the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The APK version comes from package.json, so a tag that disagrees with it
      # would publish an APK whose version does not match its release.
      - name: Check tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      # The unsigned release build exercises R8 minification, which debug skips.
      # The host is a throwaway: CI APKs are never installed (their debug key
      # changes every run, so they could not pass asset-link verification anyway).
      - name: Lint and build
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleRelease -Pmutuvia.host=ci.invalid

  release:
    name: Release APK
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload assets to the GitHub Release
    env:
      APK: mutuvia-${{ github.ref_name }}.apk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty; see docs/android.md (Release and signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MUTUVIA_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Gradle rejects a release build without a real host, so an empty
      # MUTUVIA_HOST variable fails here with a clear message.
      - name: Build signed release APK
        working-directory: android
        env:
          MUTUVIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUTUVIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MUTUVIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MUTUVIA_HOST: ${{ vars.MUTUVIA_HOST }}
        run: ./gradlew --no-daemon :app:assembleRelease "-Pmutuvia.host=$MUTUVIA_HOST"

      # apksigner fails on an unsigned or broken APK. The certificate digest it
      # prints is what ANDROID_SHA256_FINGERPRINTS must contain on the web deployment.
      - name: Verify signature and print certificate fingerprint
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          OUT="$("$APKSIGNER" verify --print-certs "dist/$APK")"
          echo "$OUT"
          # apksigner prints lowercase hex without colons; assetlinks wants AA:BB:...
          FP="$(echo "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          {
            echo "### Android release $GITHUB_REF_NAME"
            echo
            echo "Signing certificate SHA-256 (paste into \`ANDROID_SHA256_FINGERPRINTS\` on the web deployment):"
            echo
            echo '```'
            echo "$FP"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Attaches the assets to the tag's release, creating it (without notes)
      # when none exists yet.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ env.APK }}
            dist/${{ env.APK }}.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
