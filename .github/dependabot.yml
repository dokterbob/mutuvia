version: 2

updates:
  # Bun lockfile (bun.lock, the text-based format — package-ecosystem: "bun"
  # requires Bun >=1.1.39; this repo pins a much newer Bun, see Dockerfile
  # and ci.yml). Covers both dependencies and devDependencies in package.json.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      bun-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Every entry here must match a key in package.json's
      # patchedDependencies (minus its @version suffix) — enforced by
      # scripts/check-dependabot-patches.test.ts so this list and
      # patchedDependencies cannot drift apart silently.
      #
      # patches/svelte-adapter-bun@1.0.1.patch is pinned to this exact
      # version (it patches a bug in 1.0.1's own source) — a Dependabot PR
      # bumping svelte-adapter-bun would apply a stale patch to a different
      # version without anyone reviewing whether it's still needed/correct.
      # See AGENTS.md / README's patch note. Bump manually and re-check the
      # patch when a new svelte-adapter-bun release is actually wanted.
      - dependency-name: 'svelte-adapter-bun'
      # patches/bun-git-hooks@0.3.1.patch — same hazard as above. Unlike a
      # version mismatch on a real dependency, a stale patch here doesn't
      # fail `bun install` (it prints "patch file ... no longer applies" and
      # exits 0 — confirmed), so a Dependabot bump landing unreviewed would
      # silently stop applying the patch rather than erroring. See the
      # README's patches note for the "make CI fail on that warning" follow-up.
      - dependency-name: 'bun-git-hooks'

  # GitHub Actions used in .github/workflows/*.yml — all pinned by commit
  # SHA (see the "pin actions by SHA" comment style in android.yml/ci.yml);
  # Dependabot updates these by opening a PR that bumps the SHA and the
  # trailing version comment together.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']

  # Android Gradle project (android/build.gradle.kts, android/app/build.gradle.kts).
  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'weekly'
    groups:
      gradle-minor-patch:
        update-types: ['minor', 'patch']

  # Dockerfile base image (oven/bun, pinned by tag + digest).
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
