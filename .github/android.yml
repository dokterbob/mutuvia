# SPDX-License-Identifier: AGPL-3.0-or-later
# NOTE: move this file to .github/workflows/android.yml — it could not be pushed
# there from the sandbox, which lacks the GitHub `workflow` token scope.
name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'package.json'
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so `v*` tags always build.
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'package.json'
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a release run half-way through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Hostname baked into the debug APK. A placeholder keeps the manifest valid.
      MUTUVIA_HOST: ${{ vars.MUTUVIA_HOST || 'mutuvia.example.org' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Android SDK (ANDROID_HOME, platform 36, build-tools 36.0.0) is preinstalled
      # on ubuntu-24.04 runners, so no setup-android step is needed.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper jar checksum. Only main writes the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The APK version comes from package.json, so a tag that disagrees with it
      # would publish an APK whose version does not match its release.
      - name: Check tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          PKG_VERSION="$(jq -r .version package.json)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag $GITHUB_REF_NAME ($TAG_VERSION)"
            exit 1
          fi

      - name: Lint and debug build
        working-directory: android
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug "-Pmutuvia.host=$MUTUVIA_HOST"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutuvia-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release APK
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload assets to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Read-only cache: tag refs must not write caches that main would then reuse.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Check release configuration
        env:
          HOST: ${{ vars.MUTUVIA_HOST }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Repository variable MUTUVIA_HOST is empty. Set it to the deployment hostname (e.g. mutuvia.example.org) under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty. Create the release keystore and store it as a secret; see docs/android.md (Release & signing)."
            exit 1
          fi
          # Export without the leading v; used for file names and -Pmutuvia.version.
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MUTUVIA_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Passwords are passed only to this step, not exported to later steps.
      - name: Build signed release APK
        working-directory: android
        env:
          MUTUVIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUTUVIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MUTUVIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MUTUVIA_HOST: ${{ vars.MUTUVIA_HOST }}
        run: ./gradlew --no-daemon :app:assembleRelease "-Pmutuvia.host=$MUTUVIA_HOST" "-Pmutuvia.version=$VERSION"

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/mutuvia-${VERSION}.apk"
          cd dist
          sha256sum "mutuvia-${VERSION}.apk" > "mutuvia-${VERSION}.apk.sha256"
          cat "mutuvia-${VERSION}.apk.sha256"

      # Fails if the APK is unsigned or the signature is broken. The digest it prints
      # is what ANDROID_SHA256_FINGERPRINTS must contain on the web deployment.
      - name: Verify signature and print certificate fingerprint
        run: |
          OUT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "dist/mutuvia-${VERSION}.apk")"
          echo "$OUT"
          # apksigner prints lowercase hex without colons; assetlinks wants AA:BB:...
          FP="$(echo "$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          if [ -z "$FP" ]; then
            echo "::error::Could not read the signing certificate digest from apksigner output"
            exit 1
          fi
          {
            echo "### Android release ${VERSION}"
            echo
            echo "Signing certificate SHA-256 (paste into \`ANDROID_SHA256_FINGERPRINTS\` on the web deployment):"
            echo
            echo "\`\`\`"
            echo "$FP"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The release for the tag normally already exists (created with the
      # changelog notes); the action then only attaches the assets. Otherwise
      # it creates a release with an empty body.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/mutuvia-${{ env.VERSION }}.apk
            dist/mutuvia-${{ env.VERSION }}.apk.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
