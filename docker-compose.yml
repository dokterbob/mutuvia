#
# Mutuvia — Docker Compose
#
# Deployment profiles:
#   docker compose --profile sqlite up    # SQLite (simple, single-node)
#   docker compose --profile postgres up  # PostgreSQL (scalable)
#
# Local development (PG only, no app container):
#   docker compose --profile dev up -d
#
# Before running a deployment profile, copy .env.docker.example to .env and fill in the required values.

services:
  # ── SQLite deployment ────────────────────────────────────────────────────────
  app-sqlite:
    profiles: ['sqlite']
    build: .
    env_file: .env
    environment:
      DB_PROVIDER: sqlite
      DB_FILE_NAME: /data/sqlite.db
    volumes:
      - sqlite-data:/data
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ── PostgreSQL deployment ────────────────────────────────────────────────────
  app-postgres:
    profiles: ['postgres']
    build: .
    env_file: .env
    environment:
      DB_PROVIDER: pg
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: ['postgres']
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mutuvia
      POSTGRES_USER: mutuvia
      # No default: a committed/example password would otherwise ship into
      # real deployments that forget to set it. Deliberately NOT `${VAR:?err}`:
      # Compose interpolates the whole file before filtering by profile, so
      # that would also break `--profile sqlite` / `--profile dev`. The
      # official postgres image itself refuses to initialise a new database
      # with an empty superuser password, so `--profile postgres` still fails
      # loudly when this is unset. Must match DATABASE_URL's password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mutuvia']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Local development PostgreSQL ─────────────────────────────────────────────
  # Start with: docker compose --profile dev up -d
  # Then set DB_PROVIDER=pg and DATABASE_URL=postgres://mutuvia:mutuvia@localhost:5432/mutuvia in .env
  postgres-dev:
    profiles: ['dev']
    image: postgres:17-alpine
    ports:
      # Bound to loopback only — this is a local-dev convenience container
      # with a hardcoded password; it must never be reachable from the LAN
      # or the internet.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: mutuvia
      POSTGRES_USER: mutuvia
      POSTGRES_PASSWORD: mutuvia
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sqlite-data:
  pg-data:
  pgdata-dev:
